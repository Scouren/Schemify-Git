# Schemify's version-control plugins: one wasm32 guest per VCS (plugin ABI v1), each the
# shared driver of `schemify-vcs` over its backend row. The app embeds them as pinned
# built-ins (git on by default; the others off until enabled in Packages).
[workspace]
resolver = "3"
members = ["crates/git", "crates/hg", "crates/jj", "crates/svn", "crates/p4"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/Scouren/Schemify-Git"

[workspace.dependencies]
# Pinned to an SDK commit (Scouren/Schemify-Plugins); bump it with the SDK.
schemify-abi = { git = "https://github.com/Scouren/Schemify-Plugins", rev = "e0ea3a2686f695790bbae318d5a931482c8e8627", features = ["guest"] }
schemify-vcs = { git = "https://github.com/Scouren/Schemify-Plugins", rev = "e0ea3a2686f695790bbae318d5a931482c8e8627" }

[workspace.lints.rust]
# `deny`, not `forbid`: `guest::export!` allows `unsafe(no_mangle)` on its exports.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
wildcard_imports = "warn"
string_add = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"

# Small modules: size over speed, no unwinding (a panic is a trap the host reports).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
