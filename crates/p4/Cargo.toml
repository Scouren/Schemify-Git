[package]
name = "schemify-p4"
description = "The Perforce plugin for Schemify: the Source control pane, the Explorer's marks, diffs and who changed each line, for a Perforce working copy."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "p4"
# cdylib: the wasm guest. rlib: the pure parts are unit-tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
schemify-abi.workspace = true
schemify-vcs.workspace = true

[lints]
workspace = true
